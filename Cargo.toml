[workspace]
members = [
    "crimp-tests",
    "crimp-drivers/mono",
    "snapshot",
    "component-tools",
    "baselines/r3",
]
resolver = "3"

[workspace.package]
authors = ["Arjun Ramesh <arjunr2@andrew.cmu.edu>"]
version = "0.0.1"

[workspace.dependencies]
clap = { version = "4.5.40", features = ["derive"] }
prime_factorization = "1.0.5"
env_logger = "0.11.8"
anyhow = "1.0.100"
log = "0.4.28"
#wasmtime = { git = "https://github.com/bytecodealliance/wasmtime-rr-prototyping.git", branch = "crimp-dev", features = ["default"] }
#wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime-rr-prototyping.git", branch = "crimp-dev", features = ["default"] }
#wasm-crimp = { git = "https://github.com/bytecodealliance/wasmtime-rr-prototyping.git", branch = "crimp-dev", features = ["std"] }
wasmtime = { path= "../wasmtime-rr-prototyping/crates/wasmtime", features = ["default"] }
wasmtime-wasi = { path = "../wasmtime-rr-prototyping/crates/wasi", features = ["default"] }
wasm-crimp = { path = "../wasmtime-rr-prototyping/crates/wasm-crimp", features = ['std'] }
wirm = "=3.0.1"
wasmprinter = "0.244.0"
wasm-encoder = "0.244.0"
wat = "1.244.0"
